network:
  version: 2

  ethernets:
    ens18:
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.243.135/24
      routes:
        - to: default
          via: 192.168.243.2
      nameservers:
        addresses:
          - 192.168.243.2

  vlans:
    vlan10:
      id: 10
      link: ens18
      addresses:
        - 192.168.10.1/24

    vlan20:
      id: 20
      link: ens18
      addresses:
        - 192.168.20.1/24
